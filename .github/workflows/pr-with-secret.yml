name: PR with Secret Config
on:
  pull_request:
    branches:
      - main

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write secret to config file
        run: |
          mkdir -p config
          echo "${{ secrets.BIGSECRET }}" > config/.conf

      - name: Run Python script
        run: python3 run.py
